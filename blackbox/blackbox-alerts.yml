# Grafana Cloud Alerting & Recording Rules for Blackbox Monitoring

groups:
  - name: driftseeker-blackbox-critical
    interval: 30s
    rules:
      - alert: BlackboxServiceDown
        expr: blackbox_probe_success{job=~"blackbox.*"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Service {{ $labels.target }} is DOWN"
          description: |
            The {{ $labels.target }} service has been down for 2 minutes.
            Module: {{ $labels.module }}

      - alert: BlackboxMultipleServicesDown
        expr: count by (job) (blackbox_probe_success{job=~"blackbox.*"} == 0) > 1
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Multiple services down - possible infrastructure issue"
          description: "{{ $value }} services are simultaneously down."

  - name: driftseeker-blackbox-warning
    interval: 60s
    rules:
      - alert: BlackboxHighLatency
        expr: blackbox_probe_duration_seconds{job=~"blackbox.*"} > 5
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High latency for {{ $labels.target }}"
          description: "Probe latency for {{ $labels.target }} is {{ $value | humanizeDuration }} (threshold: 5s)."

      - alert: BlackboxLatencyIncreasing
        expr: |
          (
            avg_over_time(blackbox_probe_duration_seconds{job=~"blackbox.*"}[10m])
            /
            clamp_min(avg_over_time(blackbox_probe_duration_seconds{job=~"blackbox.*"}[1h]), 0.001)
          ) > 2
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Latency increasing for {{ $labels.target }}"
          description: "Latency has doubled compared to the 1-hour average."

      - alert: BlackboxHTTPErrors
        expr: blackbox_probe_http_status_code{job=~"blackbox.*"} >= 400
        for: 3m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "HTTP errors for {{ $labels.target }}"
          description: "{{ $labels.target }} returning HTTP {{ $value }}."

      - alert: BlackboxSSLCertExpiring
        expr: probe_ssl_earliest_cert_expiry{job=~"blackbox.*"} - time() < 86400 * 14
        for: 1h
        labels:
          severity: warning
          team: security
        annotations:
          summary: "SSL certificate expiring soon for {{ $labels.target }}"
          description: "SSL certificate expires in less than 14 days."

  - name: driftseeker-blackbox-info
    interval: 300s
    rules:
      - alert: BlackboxSuccessRateLow
        expr: avg_over_time(blackbox_probe_success{job=~"blackbox.*"}[5m]) < 0.95
        for: 10m
        labels:
          severity: info
          team: platform
        annotations:
          summary: "Success rate below 95% for {{ $labels.target }}"
          description: "Success rate for {{ $labels.target }} is {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: BlackboxProbeTimeoutRisk
        expr: blackbox_probe_duration_seconds{job=~"blackbox.*"} > 8
        for: 2m
        labels:
          severity: info
          team: platform
        annotations:
          summary: "Probe timeout risk for {{ $labels.target }}"
          description: "Probe duration ({{ $value | humanizeDuration }}) approaching 10s timeout."

  - name: driftseeker-blackbox-recording
    interval: 60s
    rules:
      - record: blackbox:success_rate:5m
        expr: avg by (target) (avg_over_time(blackbox_probe_success{job=~"blackbox.*"}[5m]))

      - record: blackbox:avg_latency:5m
        expr: avg by (target) (avg_over_time(blackbox_probe_duration_seconds{job=~"blackbox.*"}[5m]))

      - record: blackbox:p95_latency:5m
        expr: quantile by (target) (0.95, blackbox_probe_duration_seconds{job=~"blackbox.*"})

      - record: blackbox:active_targets
        expr: count by (job) (blackbox_probe_success{job=~"blackbox.*"})

      - record: blackbox:down_targets
        expr: count by (job) (blackbox_probe_success{job=~"blackbox.*"} == 0)
