# Prometheus Scrape Configuration for Grafana Cloud

scrape_configs:
  # Scrape Blackbox Exporter metrics directly (HTTPS on Render)
  - job_name: 'blackbox-exporter'
    scheme: https
    static_configs:
      - targets: ['driftseeker-blackbox.onrender.com']
    metrics_path: /metrics

  # Scrape Metrics Collector (aggregates probes and stores in MongoDB)
  - job_name: 'blackbox-metrics-collector'
    scheme: https
    static_configs:
      - targets: ['driftseeker-metrics-collector.onrender.com']
    metrics_path: /metrics

# Remote write configuration (supply credentials via Prometheus secret/env files)
# remote_write:
#   - url: https://prometheus-prod-XX-prod-us-central-0.grafana.net/api/prom/push
#     basic_auth:
#       username: "${GRAFANA_CLOUD_USER_ID}"
#       password_file: /etc/prometheus/grafana_api_key

rule_files:
  - 'blackbox-alerts.yml'
