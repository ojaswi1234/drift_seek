# Blackbox Exporter Monitoring Stack for DriftSeeker
# Run from repo root with: docker compose -f blackbox/docker-compose.yml up -d
# Or from blackbox/ directory with: docker compose up -d

services:
  blackbox-exporter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: driftseeker-blackbox
    restart: unless-stopped
    ports:
      - "9115:9115"
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9115/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - driftseeker-network

  metrics-collector:
    build:
      context: ./metrics-collector
      dockerfile: Dockerfile
    container_name: driftseeker-metrics-collector
    restart: unless-stopped
    ports:
      - "9116:9116"
    environment:
      - BLACKBOX_URL=http://blackbox-exporter:9115
      - MONGODB_URI=mongodb://mongo:27017
      - DB_NAME=system_seek
      - COLLECTION_INTERVAL=60000
      - APP_URL=http://app:3000
      - TERMINAL_URL=http://terminal-server:3001/health
      - GRPC_URL=grpc-worker:50051
      - MONGO_URL=mongo:27017
      - REDIS_URL=redis:6379
    depends_on:
      - blackbox-exporter
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9116/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - driftseeker-network

  prometheus:
    image: prom/prometheus:latest
    container_name: driftseeker-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./blackbox-alerts.yml:/etc/prometheus/blackbox-alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    depends_on:
      - blackbox-exporter
      - metrics-collector
    networks:
      - driftseeker-network

volumes:
  prometheus-data:

networks:
  driftseeker-network:
    external: true
    name: driftseeker-network
