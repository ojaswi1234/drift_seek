name: DriftSeeker Watchtower

on:
  schedule:
    # GitHub Actions minimum reliable cron interval is every 5 minutes
    - cron: '*/5 * * * *'

  workflow_dispatch:

jobs:
  run-pings:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up the Watchtower API
        env:
          WATCHTOWER_URL: ${{ vars.WATCHTOWER_URL || 'https://drift-seek.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set"
            exit 1
          fi
          curl -sS -X GET "${WATCHTOWER_URL%/}/api/cron/watchtower" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --fail
