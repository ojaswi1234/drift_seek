# ============================================================
# DriftSeek Terminal Server — nginx Reverse Proxy Config
# ============================================================
# STEP 1 (now): Apply this HTTP-only config to get nginx running.
#   sudo cp nginx.conf /etc/nginx/sites-available/driftseek
#   sudo ln -sf /etc/nginx/sites-available/driftseek /etc/nginx/sites-enabled/driftseek
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# STEP 2 (after nginx is running): Get a free TLS cert via Certbot.
#   sudo apt install certbot python3-certbot-nginx -y
#   sudo certbot --nginx -d driftseek.duckdns.org
#   (Certbot will automatically upgrade this config to HTTPS)
# ============================================================

# HTTP — proxy to terminal-server + allow Certbot to issue a cert
server {
    listen 80;
    listen [::]:80;
    server_name driftseek.duckdns.org;

    # Certbot ACME challenge (needed to issue a TLS cert)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── Main proxy (HTTP + Socket.io WebSocket) ──────────────
    location / {
        proxy_pass         http://127.0.0.1:3001;

        # REQUIRED for Socket.io WebSocket upgrade
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Keep WebSocket connections alive (terminal sessions can be long)
        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
        proxy_connect_timeout    10s;

        # Disable buffering so terminal output streams in real-time
        proxy_buffering off;
        proxy_cache     off;
    }

    # ── Health check (no auth) ───────────────────────────────
    location = /health {
        proxy_pass         http://127.0.0.1:3001/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log         off;
    }
}

# ── After running Certbot, it will auto-add an HTTPS server  ─
# ── block below this one. You don't need to edit anything.   ─
