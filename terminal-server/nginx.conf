# ============================================================
# DriftSeek Terminal Server — nginx Reverse Proxy Config
# ============================================================
# Drop this file on your GCP VM:
#   sudo cp nginx.conf /etc/nginx/sites-available/driftseek
#   sudo ln -sf /etc/nginx/sites-available/driftseek /etc/nginx/sites-enabled/driftseek
#   sudo rm -f /etc/nginx/sites-enabled/default   # remove the default placeholder
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then get a TLS cert (Certbot):
#   sudo apt install certbot python3-certbot-nginx -y
#   sudo certbot --nginx -d driftseek.duckdns.org
# ============================================================

# Redirect plain HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name driftseek.duckdns.org;

    # Let Certbot manage its own challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS + WebSocket proxy to terminal-server on 127.0.0.1:3001
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name driftseek.duckdns.org;

    # TLS — Certbot fills these in automatically; shown here for clarity
    # ssl_certificate     /etc/letsencrypt/live/driftseek.duckdns.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/driftseek.duckdns.org/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    # ── Main proxy (HTTP + Socket.io WebSocket) ──────────────
    location / {
        proxy_pass         http://127.0.0.1:3001;

        # REQUIRED for Socket.io WebSocket upgrade
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Keep WebSocket connections alive (terminal sessions can be long)
        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
        proxy_connect_timeout    10s;

        # Disable buffering so terminal output streams in real-time
        proxy_buffering off;
        proxy_cache     off;
    }

    # ── Health check endpoint (no auth required) ─────────────
    location = /health {
        proxy_pass         http://127.0.0.1:3001/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log         off;
    }

    # ── gRPC passthrough (port 50052 handled separately below) ─
    # If you want gRPC over HTTPS on 443, uncomment this block
    # and change the main location to handle only non-gRPC traffic.
    # location /driftseeker.execution.SandboxManager/ {
    #     grpc_pass grpc://127.0.0.1:50052;
    #     grpc_set_header Host $host;
    # }
}

