services:
  # gRPC Worker Service (Private Service for internal gRPC traffic)
  - type: pserv
    name: driftseeker-grpc-worker
    env: docker
    dockerfilePath: ./grpc-worker/Dockerfile.render
    dockerContext: .
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "50051"
    autoDeploy: true

  # Terminal Server Service
  - type: web
    name: driftseeker-terminal-server
    env: docker
    dockerfilePath: ./terminal-server/Dockerfile.render
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: GRPC_PORT
        value: "50052"
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://drift-seek.vercel.app
    healthCheckPath: /health
    autoDeploy: true

  # Main Next.js App
  - type: web
    name: driftseeker-app
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: NEXTAUTH_URL
        value: https://drift-seek.vercel.app
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://drift-seek.vercel.app
      - key: NEXT_PUBLIC_SERVER_BASE_URL
        value: https://driftseek.duckdns.org
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: GITHUB_ID
        sync: false
      - key: GITHUB_SECRET
        sync: false
      - key: GRPC_WORKER_URL
        value: driftseeker-grpc-worker:50051
    healthCheckPath: /api/restricted
    autoDeploy: true

  # Blackbox Exporter
  - type: web
    name: driftseeker-blackbox
    env: docker
    dockerfilePath: ./blackbox/Dockerfile
    dockerContext: ./blackbox
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
    healthCheckPath: /health
    autoDeploy: true

  # Metrics Collector
  - type: web
    name: driftseeker-metrics-collector
    env: docker
    dockerfilePath: ./blackbox/metrics-collector/Dockerfile
    dockerContext: ./blackbox/metrics-collector
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "9116"
      - key: BLACKBOX_URL
        value: https://driftseeker-blackbox.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: system_seek
      - key: COLLECTION_INTERVAL
        value: "60000"
      - key: APP_URL
        value: https://drift-seek.vercel.app
      - key: TERMINAL_URL
        value: https://driftseek.duckdns.org/health
      - key: GRPC_URL
        value: driftseeker-grpc-worker:50051
    healthCheckPath: /health
    autoDeploy: true

  # Managed Redis (Render Key Value)
  - type: redis
    name: driftseeker-redis
    plan: free
    ipAllowList: []
